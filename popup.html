<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Profile Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CS2 Profile Checker</h1>
    </header>
    <main>
      <div class="input-group">
        <label for="profileInput">Steam ID / Profile URL</label>
        <input type="text" id="profileInput" placeholder="Paste Steam profile URL or ID...">
        <div id="errorMsg" class="error-msg hidden">Please enter a valid Steam ID or URL.</div>
      </div>
      <div class="button-group">
        <button id="cstrackerBtn" class="tracker-btn cstracker">Open on CSTracker</button>
        <button id="cs2trackerBtn" class="tracker-btn cs2tracker">Open on CS2Tracker</button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
