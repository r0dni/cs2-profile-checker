<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Profile Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CS2 Profile Checker</h1>
    </header>
    <main>
      <div class="input-group">
        <label for="profileInput">Steam ID / Profile URL</label>
        <div class="input-row">
          <input type="text" id="profileInput" placeholder="Paste Steam profile URL or ID...">
          <button id="clearInputBtn" class="action-btn" title="Очистить поле">✕</button>
          <div class="input-actions">
            <button id="pasteClipboardBtn" class="icon-btn" title="Вставить из буфера обмена">📋</button>
            <button id="tabUrlBtn" class="icon-btn" title="Взять URL из вкладки">🌐</button>
          </div>
        </div>
        <div id="errorMsg" class="error-msg hidden">Please enter a valid Steam ID or URL.</div>
      </div>

      <div class="section-title">Trackers</div>
      <div class="button-group trackers-grid">
        <button id="cstrackerBtn" class="tracker-btn cstracker">CSTracker</button>
        <button id="cs2trackerBtn" class="tracker-btn cs2tracker">CS2Tracker</button>
        <button id="faceitFinderBtn" class="tracker-btn faceit">Faceit Finder</button>
        <button id="leetifyBtn" class="tracker-btn leetify">Leetify</button>
      </div>

      <div class="section-title">Player Note</div>
      <div class="note-container">
        <div class="tags-container">
          <button type="button" class="tag-btn" data-color="danger" data-tag="Софт">Софт</button>
          <button type="button" class="tag-btn" data-color="danger" data-tag="Токсик">Токсик</button>
          <button type="button" class="tag-btn" data-color="warning" data-tag="Твинк">Твинк</button>
          <button type="button" class="tag-btn" data-color="success" data-tag="Хороший игрок">Хороший игрок</button>
        </div>
        <textarea id="playerNote" rows="3" placeholder="Заметка по игроку (подозрение в софте, твинк, смайкер...)"></textarea>
        <div class="note-footer">
          <span id="noteStatus" class="note-status"></span>
          <button id="deleteNoteBtn" class="delete-btn">Удалить заметку</button>
        </div>
      </div>

      <div class="data-actions">
        <button id="exportBtn" class="data-btn">📥 Экспорт</button>
        <button id="importBtn" class="data-btn">📤 Импорт</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;">
      </div>
      <div class="viewer-action">
        <button id="viewAllNotesBtn" class="data-btn full-width">📋 Все заметки</button>
      </div>
    </main>
  </div>

  <!-- Modal for viewing all notes -->
  <div id="allNotesModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Сохраненные заметки</h2>
        <button id="closeModalBtn" class="close-btn">✕</button>
      </div>
      <div class="modal-search">
        <input type="text" id="modalSearchInput" placeholder="Поиск по SteamID или заметке...">
      </div>
      <div id="notesListContainer" class="notes-list">
        <!-- Notes dynamically populated here -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
